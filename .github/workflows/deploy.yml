name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'dev*'
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/dev')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build artifact
        run: |
          # Make a clean staging dir, copy contents (not the dir itself) into it
          mkdir -p _site
          # Use a tar pipeline to copy CONTENTS of the repo, not the repo dir itself
          # Exclude .git and the .github dir
          tar --exclude='./.git' --exclude='./_site' --exclude='./.github' -cf - . | tar -xf - -C _site

          # For non-main branches, nest everything under <branch-name>/
          # so the final URL is /<repo>/<branch>/index.html
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            BRANCH_NAME=$(echo "${{ github.ref }}" | sed 's|refs/heads/||')
            mkdir -p "_site/$BRANCH_NAME"
            shopt -s dotglob
            # Move all files (including hidden) into the subfolder.
            # Skip the destination dir itself to avoid moving into self.
            for f in _site/*; do
              base=$(basename "$f")
              if [[ "$base" != "_site" && "$base" != "$BRANCH_NAME" ]]; then
                mv "$f" "_site/$BRANCH_NAME/"
              fi
            done
            shopt -u dotglob
          fi
          echo "Final _site structure:"
          find _site -maxdepth 2 -type d

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages (multi-branch)

on:
  push:
    branches:
      - main
      - 'dev*'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Main: check out into /_site/ (the Pages artifact dir) directly.
      # The repo root becomes _site, so all files end up at the site root.
      - name: Checkout main into _site
        uses: actions/checkout@v4
        with:
          ref: main
          path: _site

      # For non-main triggers, also check out the dev branch into _site/<branch>/
      - name: Checkout trigger branch into _site/<branch>
        if: github.ref != 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: _site/${{ github.ref_name }}

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: List final _site structure
        run: |
          echo "=== Final structure ==="
          find _site -maxdepth 2 -type d
          echo "=== Root files ==="
          ls -la _site/ | head -20

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

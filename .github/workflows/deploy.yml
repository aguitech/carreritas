name: Deploy to GitHub Pages

'on':
  push:
    branches:
      - main
      - 'dev*'
  workflow_dispatch:

# Sets concurrency: cancel in-progress runs for the same branch
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Default to read-all repo contents; needs write for the gh-pages env
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/dev')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build artifact (copy static site, branch into subfolder)
        run: |
          mkdir -p _site
          cp -r . _site/
          # For non-main branches, nest everything under <branch-name>/
          # so the final URL is /<repo>/<branch>/index.html
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            BRANCH_NAME=$(echo "${{ github.ref }}" | sed 's|refs/heads/||')
            mkdir -p "_site/$BRANCH_NAME"
            shopt -s dotglob
            # Move all files (including hidden) into the subfolder
            # Skip the _site dir itself to avoid recursion
            for f in _site/*; do
              if [[ "$(basename "$f")" != "_site" ]]; then
                mv "$f" "_site/$BRANCH_NAME/"
              fi
            done
            shopt -u dotglob
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

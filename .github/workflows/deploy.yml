name: Deploy to GitHub Pages (multi-branch)

on:
  push:
    branches:
      - main
      - 'dev*'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Always check out main as the base
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      # For non-main triggers, also check out the dev branch
      - name: Checkout trigger branch
        if: github.ref != 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: dev

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build artifact
        run: |
          mkdir -p _site
          # Copy main contents (using tar to avoid 'copy into self')
          tar --exclude='./.git' --exclude='./_site' --exclude='./.github' -cf - . | tar -xf - -C _site
          # Note: this runs in the main checkout dir

          # If we have a dev branch checked out, add it under <branch>/ subfolder
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            BRANCH_NAME=$(echo "${{ github.ref }}" | sed 's|refs/heads/||')
            mkdir -p "_site/$BRANCH_NAME"
            # Copy dev branch contents into the subfolder
            (cd dev && tar --exclude='./.git' --exclude='./.github' -cf - .) | tar -xf - -C "_site/$BRANCH_NAME"
            echo "=== Deployed $BRANCH_NAME at /$BRANCH_NAME/ ==="
          else
            echo "=== Deployed main at / ==="
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

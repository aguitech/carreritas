name: Deploy to GitHub Pages (main + all dev* branches)

'on':
  push:
    branches:
      - main
  workflow_dispatch:

# No concurrency: every push gets its own deploy
concurrency: deploy-${{ github.ref }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v4

      # Always check out main into _site/
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: _site

      - name: List all dev* branches
        id: list-devs
        run: |
          # Get all remote branches matching dev* via git ls-remote
          DEVS=$(git ls-remote --heads https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git 'refs/heads/dev*' | awk '{print $2}' | sed 's|refs/heads/||' | sort)
          echo "Found dev branches:"
          echo "$DEVS"
          # Save as multiline output
          echo "devs<<EOF" >> $GITHUB_OUTPUT
          echo "$DEVS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Checkout each dev branch into _site/<branch>/
        env:
          DEVS: ${{ steps.list-devs.outputs.devs }}
        run: |
          if [[ -z "$DEVS" ]]; then
            echo "No dev branches to check out"
            exit 0
          fi
          while IFS= read -r BRANCH; do
            [[ -z "$BRANCH" ]] && continue
            echo "Checking out $BRANCH into _site/$BRANCH/"
            mkdir -p "_site/$BRANCH"
            # Sparse checkout: only files, not .git history
            git clone --depth 1 --branch "$BRANCH" --single-branch "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "/tmp/$BRANCH" 2>/dev/null || {
              echo "  Failed to clone $BRANCH, skipping"
              continue
            }
            # Copy contents (not the .git folder) into _site/<branch>/
            shopt -s dotglob
            for f in /tmp/$BRANCH/*; do
              base=$(basename "$f")
              [[ "$base" == ".git" ]] && continue
              cp -r "$f" "_site/$BRANCH/"
            done
            shopt -u dotglob
            rm -rf "/tmp/$BRANCH"
          done <<< "$DEVS"

      - name: Show final structure
        run: |
          echo "=== _site top-level ==="
          ls -la _site/
          echo "=== Subdirs (one per dev branch) ==="
          find _site -mindepth 1 -maxdepth 1 -type d

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
